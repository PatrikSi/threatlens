x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://postgres:change-me-postgres-password@db:5432/threatlens
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: replace-with-long-random-secret
  JWT_EXPIRES_MINUTES: "1440"
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: replace-with-strong-admin-password
  APP_ENV: production
  ALLOW_SELF_REGISTRATION: "false"
  ALLOW_LEGACY_UNSCOPED_TOKENS: "false"
  DEFAULT_API_TOKEN_EXPIRY_DAYS: "90"
  ALLOW_PRIVATE_NETWORK_FETCH: "false"
  ALLOW_PRIVATE_NETWORK_WEBHOOKS: "false"
  FEED_MAX_BYTES: "2000000"
  OUTBOUND_MAX_REDIRECTS: "5"
  AUTH_LOGIN_MAX_ATTEMPTS: "8"
  AUTH_LOGIN_WINDOW_SECONDS: "300"
  AUTH_LOGIN_LOCKOUT_SECONDS: "900"
  API_TOKEN_LAST_USED_UPDATE_INTERVAL_SECONDS: "300"
  CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
  TRUSTED_PROXY_CIDRS: 127.0.0.1/32,::1/128,172.16.0.0/12
  AUTH_COOKIE_NAME: threatlens_session
  AUTH_COOKIE_SECURE: "true"
  AUTH_COOKIE_SAMESITE: lax
  AUTH_CSRF_COOKIE_NAME: threatlens_csrf
  AUTH_CSRF_HEADER_NAME: x-csrf-token
  AUTH_REQUIRE_CSRF: "true"
  PROBE_FEED_METADATA_ON_CREATE: "false"
  PROBE_FEED_METADATA_ON_IMPORT: "false"
  MAX_METADATA_BACKFILL_TASKS_PER_REQUEST: "100"
  DISPATCH_DUE_FEEDS_BATCH_SIZE: "500"
  DISPATCH_UNCLASSIFIED_ITEMS_BATCH_SIZE: "200"
  DISPATCH_ITEMS_MISSING_IOCS_BATCH_SIZE: "200"
  DISPATCH_FEED_METADATA_SCAN_LIMIT: "250"
  DISPATCH_FEED_METADATA_QUEUE_LIMIT: "50"
  ALERT_MATCHES_KEYWORD_CAP: "512"
  STATS_TOP_DOMAINS_LIMIT: "10"
  RUN_MIGRATIONS_ON_STARTUP: "false"
  SEED_ADMIN_ON_STARTUP: "false"
  SEED_ADMIN_FORCE_ROLE: "false"
  SEED_ADMIN_REACTIVATE_EXISTING: "false"
  SEED_ADMIN_RESET_PASSWORD_ON_STARTUP: "false"
  LOG_LEVEL: INFO
  HEALTH_WORKER_PING_TIMEOUT_SECONDS: "1.0"
  BEAT_HEARTBEAT_KEY: threatlens:beat:heartbeat
  BEAT_HEARTBEAT_TTL_SECONDS: "180"
  BEAT_HEARTBEAT_STALE_AFTER_SECONDS: "180"
  BEAT_HEARTBEAT_INTERVAL_SECONDS: "60"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: threatlens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me-postgres-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d threatlens"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: patriksi/private-main:api
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 8

  worker:
    image: patriksi/private-main:worker
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy
    command: ["celery", "-A", "app.tasks.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=4"]

  beat:
    image: patriksi/private-main:worker
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy
    command: ["celery", "-A", "app.tasks.celery_app.celery_app", "beat", "--loglevel=INFO"]

  web:
    image: patriksi/private-main:web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
