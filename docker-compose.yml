x-db-environment: &db-environment
  POSTGRES_DB: "${POSTGRES_DB:-threatlens}"
  POSTGRES_USER: "${POSTGRES_USER:-threatlens}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"

x-redis-environment: &redis-environment
  REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"

x-backend-environment: &backend-environment
  <<: [*db-environment, *redis-environment]
  APP_ENV: "${APP_ENV:-production}"
  DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-threatlens}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-threatlens}}"
  REDIS_URL: "${REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0}"
  JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set}"
  APP_DATA_ENCRYPTION_KEY: "${APP_DATA_ENCRYPTION_KEY:?APP_DATA_ENCRYPTION_KEY must be set}"
  APP_DATA_ENCRYPTION_PREVIOUS_KEYS: "${APP_DATA_ENCRYPTION_PREVIOUS_KEYS:-}"
  REQUIRE_EXPLICIT_DATA_ENCRYPTION_KEY: "${REQUIRE_EXPLICIT_DATA_ENCRYPTION_KEY:-true}"
  JWT_EXPIRES_MINUTES: "${JWT_EXPIRES_MINUTES:-1440}"
  ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@example.com}"
  ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}"
  ALLOW_SELF_REGISTRATION: "${ALLOW_SELF_REGISTRATION:-false}"
  ALLOW_LEGACY_UNSCOPED_TOKENS: "${ALLOW_LEGACY_UNSCOPED_TOKENS:-false}"
  DEFAULT_API_TOKEN_EXPIRY_DAYS: "${DEFAULT_API_TOKEN_EXPIRY_DAYS:-90}"
  AI_ENABLED: "${AI_ENABLED:-false}"
  AI_API_KEY: "${AI_API_KEY:-}"
  EXPOSE_API_DOCS_IN_PRODUCTION: "${EXPOSE_API_DOCS_IN_PRODUCTION:-false}"
  EXPOSE_OPENAPI_SCHEMA_IN_PRODUCTION: "${EXPOSE_OPENAPI_SCHEMA_IN_PRODUCTION:-true}"
  FEED_MAX_BYTES: "${FEED_MAX_BYTES:-2000000}"
  ALLOW_PRIVATE_NETWORK_FETCH: "${ALLOW_PRIVATE_NETWORK_FETCH:-false}"
  ALLOW_PRIVATE_NETWORK_AI: "${ALLOW_PRIVATE_NETWORK_AI:-false}"
  ALLOW_PRIVATE_NETWORK_WEBHOOKS: "${ALLOW_PRIVATE_NETWORK_WEBHOOKS:-false}"
  NOTIFICATION_WEBHOOK_ALLOWED_HOSTS: "${NOTIFICATION_WEBHOOK_ALLOWED_HOSTS:-}"
  NOTIFICATION_WEBHOOK_ALLOW_ADMIN_UNRESTRICTED: "${NOTIFICATION_WEBHOOK_ALLOW_ADMIN_UNRESTRICTED:-false}"
  OUTBOUND_MAX_REDIRECTS: "${OUTBOUND_MAX_REDIRECTS:-5}"
  AUTH_LOGIN_MAX_ATTEMPTS: "${AUTH_LOGIN_MAX_ATTEMPTS:-8}"
  AUTH_LOGIN_WINDOW_SECONDS: "${AUTH_LOGIN_WINDOW_SECONDS:-300}"
  AUTH_LOGIN_LOCKOUT_SECONDS: "${AUTH_LOGIN_LOCKOUT_SECONDS:-900}"
  API_TOKEN_LAST_USED_UPDATE_INTERVAL_SECONDS: "${API_TOKEN_LAST_USED_UPDATE_INTERVAL_SECONDS:-300}"
  CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
  TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
  ALLOWED_HOSTS: "${ALLOWED_HOSTS:-api,localhost,127.0.0.1,::1}"
  AUTH_COOKIE_NAME: "${AUTH_COOKIE_NAME:-threatlens_session}"
  AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-true}"
  AUTH_COOKIE_SAMESITE: "${AUTH_COOKIE_SAMESITE:-lax}"
  AUTH_CSRF_COOKIE_NAME: "${AUTH_CSRF_COOKIE_NAME:-threatlens_csrf}"
  AUTH_CSRF_HEADER_NAME: "${AUTH_CSRF_HEADER_NAME:-x-csrf-token}"
  AUTH_REQUIRE_CSRF: "${AUTH_REQUIRE_CSRF:-true}"
  RUN_MIGRATIONS_ON_STARTUP: "${RUN_MIGRATIONS_ON_STARTUP:-true}"
  SEED_ADMIN_ON_STARTUP: "${SEED_ADMIN_ON_STARTUP:-false}"
  PROBE_FEED_METADATA_ON_CREATE: "${PROBE_FEED_METADATA_ON_CREATE:-false}"
  PROBE_FEED_METADATA_ON_IMPORT: "${PROBE_FEED_METADATA_ON_IMPORT:-false}"
  MAX_METADATA_BACKFILL_TASKS_PER_REQUEST: "${MAX_METADATA_BACKFILL_TASKS_PER_REQUEST:-100}"
  DISPATCH_DUE_FEEDS_BATCH_SIZE: "${DISPATCH_DUE_FEEDS_BATCH_SIZE:-500}"
  DISPATCH_UNCLASSIFIED_ITEMS_BATCH_SIZE: "${DISPATCH_UNCLASSIFIED_ITEMS_BATCH_SIZE:-200}"
  DISPATCH_ITEMS_MISSING_IOCS_BATCH_SIZE: "${DISPATCH_ITEMS_MISSING_IOCS_BATCH_SIZE:-200}"
  DISPATCH_ITEMS_MISSING_AI_ENRICHMENT_BATCH_SIZE: "${DISPATCH_ITEMS_MISSING_AI_ENRICHMENT_BATCH_SIZE:-200}"
  DISPATCH_ITEMS_FAILED_AI_ENRICHMENT_AFTER_SECONDS: "${DISPATCH_ITEMS_FAILED_AI_ENRICHMENT_AFTER_SECONDS:-3600}"
  AI_AUTO_ENRICH_NEW_ITEM_MAX_AGE_HOURS: "${AI_AUTO_ENRICH_NEW_ITEM_MAX_AGE_HOURS:-24}"
  AI_DAILY_BRIEF_SOURCE_AUDIT_LIMIT: "${AI_DAILY_BRIEF_SOURCE_AUDIT_LIMIT:-500}"
  DISPATCH_FEED_METADATA_SCAN_LIMIT: "${DISPATCH_FEED_METADATA_SCAN_LIMIT:-250}"
  DISPATCH_FEED_METADATA_QUEUE_LIMIT: "${DISPATCH_FEED_METADATA_QUEUE_LIMIT:-50}"
  DISPATCH_AI_REPROCESS_BATCH_SIZE: "${DISPATCH_AI_REPROCESS_BATCH_SIZE:-100}"
  ALERT_MATCHES_KEYWORD_CAP: "${ALERT_MATCHES_KEYWORD_CAP:-512}"
  STATS_TOP_DOMAINS_LIMIT: "${STATS_TOP_DOMAINS_LIMIT:-10}"
  SEED_ADMIN_FORCE_ROLE: "${SEED_ADMIN_FORCE_ROLE:-false}"
  SEED_ADMIN_REACTIVATE_EXISTING: "${SEED_ADMIN_REACTIVATE_EXISTING:-false}"
  SEED_ADMIN_RESET_PASSWORD_ON_STARTUP: "${SEED_ADMIN_RESET_PASSWORD_ON_STARTUP:-false}"
  LOG_LEVEL: "${LOG_LEVEL:-INFO}"
  HEALTH_WORKER_PING_TIMEOUT_SECONDS: "${HEALTH_WORKER_PING_TIMEOUT_SECONDS:-1.0}"
  BEAT_HEARTBEAT_KEY: "${BEAT_HEARTBEAT_KEY:-threatlens:beat:heartbeat}"
  BEAT_HEARTBEAT_TTL_SECONDS: "${BEAT_HEARTBEAT_TTL_SECONDS:-180}"
  BEAT_HEARTBEAT_STALE_AFTER_SECONDS: "${BEAT_HEARTBEAT_STALE_AFTER_SECONDS:-180}"
  BEAT_HEARTBEAT_INTERVAL_SECONDS: "${BEAT_HEARTBEAT_INTERVAL_SECONDS:-60}"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      <<: *db-environment
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backplane

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      <<: *redis-environment
    command:
      [
        "sh",
        "-c",
        "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\"",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backplane

  api:
    image: ghcr.io/patriksi/threatlens-backend:${THREATLENS_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      <<: *backend-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health/live', timeout=2)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - frontend
      - backplane

  worker:
    image: ghcr.io/patriksi/threatlens-backend:${THREATLENS_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      <<: *backend-environment
      RUN_MIGRATIONS_ON_STARTUP: "false"
      SEED_ADMIN_ON_STARTUP: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command:
      [
        "celery",
        "-A",
        "app.tasks.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=${WORKER_CONCURRENCY:-4}",
        "--queues=default,ingest,processing,notifications,maintenance,ai",
        "-n",
        "worker@%h",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from app.tasks.celery_app import celery_app; import os, sys; target = f'worker@{os.environ[\\\"HOSTNAME\\\"]}'; result = celery_app.control.inspect(timeout=2).ping([target]) or {}; sys.exit(0 if target in result else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - backplane

  beat:
    image: ghcr.io/patriksi/threatlens-backend:${THREATLENS_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      <<: *backend-environment
      RUN_MIGRATIONS_ON_STARTUP: "false"
      SEED_ADMIN_ON_STARTUP: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["celery", "-A", "app.tasks.celery_app.celery_app", "beat", "--loglevel=INFO"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import sys; cmdline = open('/proc/1/cmdline', 'rb').read().decode('utf-8', 'ignore').replace('\\x00', ' '); sys.exit(0 if 'celery' in cmdline and 'beat' in cmdline else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - backplane

  web:
    image: ghcr.io/patriksi/threatlens-web:${THREATLENS_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${THREATLENS_WEB_PORT:-3000}:3000"
    environment:
      THREATLENS_CSP_CONNECT_SRC: "${THREATLENS_CSP_CONNECT_SRC:-'self'}"
      THREATLENS_CSP_FRAME_SRC: "${THREATLENS_CSP_FRAME_SRC:-'self'}"
    networks:
      - frontend

volumes:
  postgres_data:
  redis_data:

networks:
  frontend: {}
  backplane: {}
