services:
  db:
    image: postgres:16@sha256:23af655ba1ddf74eaa002e3deaf5fce022ab8791672336a7c1fb0ef2d57efb7f
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-threatlens}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backplane

  redis:
    image: redis:7-alpine@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command:
      [
        "sh",
        "-c",
        "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\"",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backplane

  api:
    image: ghcr.io/patriksi/threatlens-backend:latest
    build:
      context: ./backend
      args:
        BUILD_DATE: ${BUILD_DATE:-unknown}
        VCS_REF: ${VCS_REF:-unknown}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}
      SEED_ADMIN_ON_STARTUP: ${SEED_ADMIN_ON_STARTUP:-false}
      REQUIRE_EXPLICIT_DATA_ENCRYPTION_KEY: ${REQUIRE_EXPLICIT_DATA_ENCRYPTION_KEY:-true}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_REQUIRE_CSRF: ${AUTH_REQUIRE_CSRF:-true}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128,172.31.240.0/24}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-api,localhost,127.0.0.1,::1}
      EXPOSE_OPENAPI_SCHEMA_IN_PRODUCTION: ${EXPOSE_OPENAPI_SCHEMA_IN_PRODUCTION:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health/live', timeout=2)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - frontend
      - backplane

  worker:
    image: ghcr.io/patriksi/threatlens-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      RUN_MIGRATIONS_ON_STARTUP: "false"
      SEED_ADMIN_ON_STARTUP: "false"
      REQUIRE_EXPLICIT_DATA_ENCRYPTION_KEY: ${REQUIRE_EXPLICIT_DATA_ENCRYPTION_KEY:-true}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_REQUIRE_CSRF: ${AUTH_REQUIRE_CSRF:-true}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-api,localhost,127.0.0.1,::1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command:
      [
        "celery",
        "-A",
        "app.tasks.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=${WORKER_CONCURRENCY:-4}",
        "--queues=default,ingest,processing,notifications,maintenance,ai",
        "-n",
        "worker@%h",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from app.tasks.celery_app import celery_app; import os, sys; target = f'worker@{os.environ[\\\"HOSTNAME\\\"]}'; result = celery_app.control.inspect(timeout=2).ping([target]) or {}; sys.exit(0 if target in result else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - backplane

  beat:
    image: ghcr.io/patriksi/threatlens-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      RUN_MIGRATIONS_ON_STARTUP: "false"
      SEED_ADMIN_ON_STARTUP: "false"
      REQUIRE_EXPLICIT_DATA_ENCRYPTION_KEY: ${REQUIRE_EXPLICIT_DATA_ENCRYPTION_KEY:-true}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_REQUIRE_CSRF: ${AUTH_REQUIRE_CSRF:-true}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-api,localhost,127.0.0.1,::1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["celery", "-A", "app.tasks.celery_app.celery_app", "beat", "--loglevel=INFO"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import sys; cmdline = open('/proc/1/cmdline', 'rb').read().decode('utf-8', 'ignore').replace('\\x00', ' '); sys.exit(0 if 'celery' in cmdline and 'beat' in cmdline else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - backplane

  web:
    image: ghcr.io/patriksi/threatlens-web:latest
    build:
      context: ./web
      args:
        BUILD_DATE: ${BUILD_DATE:-unknown}
        VCS_REF: ${VCS_REF:-unknown}
        VITE_API_BASE_URL: ${WEB_VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      THREATLENS_CSP_CONNECT_SRC: "${THREATLENS_CSP_CONNECT_SRC:-'self'}"
      THREATLENS_CSP_FRAME_SRC: "${THREATLENS_CSP_FRAME_SRC:-'self'}"
    networks:
      - frontend

volumes:
  postgres_data:
  redis_data:

networks:
  frontend:
    ipam:
      config:
        - subnet: 172.31.240.0/24
  backplane: {}
