services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      <<: *db-environment
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backplane

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      <<: *redis-environment
    command:
      [
        "sh",
        "-c",
        "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\"",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backplane

  api:
    image: ghcr.io/patriksi/threatlens-backend:${THREATLENS_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      <<: *backend-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health/live', timeout=2)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - frontend
      - backplane

  worker:
    image: ghcr.io/patriksi/threatlens-backend:${THREATLENS_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      <<: *backend-environment
      RUN_MIGRATIONS_ON_STARTUP: "false"
      SEED_ADMIN_ON_STARTUP: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command:
      [
        "celery",
        "-A",
        "app.tasks.celery_app.celery_app",
        "worker",
        "--loglevel=${LOG_LEVEL:-INFO}",
        "--concurrency=${WORKER_CONCURRENCY:-4}",
        "--queues=default,ingest,processing",
        "-n",
        "worker@%h",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from app.tasks.celery_app import celery_app; import os, sys; target = f'worker@{os.environ[\\\"HOSTNAME\\\"]}'; result = celery_app.control.inspect(timeout=2).ping([target]) or {}; sys.exit(0 if target in result else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - backplane

  worker-ai:
    image: ghcr.io/patriksi/threatlens-backend:${THREATLENS_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      <<: *backend-environment
      RUN_MIGRATIONS_ON_STARTUP: "false"
      SEED_ADMIN_ON_STARTUP: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command:
      [
        "celery",
        "-A",
        "app.tasks.celery_app.celery_app",
        "worker",
        "--loglevel=${LOG_LEVEL:-INFO}",
        "--concurrency=${AI_WORKER_CONCURRENCY:-1}",
        "--queues=ai,ai-reports-v2",
        "-n",
        "ai@%h",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from app.tasks.celery_app import celery_app; import os, sys; target = f'ai@{os.environ[\\\"HOSTNAME\\\"]}'; inspector = celery_app.control.inspect(destination=[target], timeout=2); ping = inspector.ping() or {}; queues = inspector.active_queues() or {}; names = {entry.get('name') for entry in queues.get(target, [])}; sys.exit(0 if target in ping and {'ai', 'ai-reports-v2'} <= names else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - backplane

  worker-maintenance:
    image: ghcr.io/patriksi/threatlens-backend:${THREATLENS_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      <<: *backend-environment
      RUN_MIGRATIONS_ON_STARTUP: "false"
      SEED_ADMIN_ON_STARTUP: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command:
      [
        "celery",
        "-A",
        "app.tasks.celery_app.celery_app",
        "worker",
        "--loglevel=${LOG_LEVEL:-INFO}",
        "--concurrency=${MAINTENANCE_WORKER_CONCURRENCY:-1}",
        "--queues=maintenance",
        "-n",
        "maintenance@%h",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from app.tasks.celery_app import celery_app; import os, sys; target = f'maintenance@{os.environ[\\\"HOSTNAME\\\"]}'; result = celery_app.control.inspect(timeout=2).ping([target]) or {}; sys.exit(0 if target in result else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - backplane

  worker-notifications:
    image: ghcr.io/patriksi/threatlens-backend:${THREATLENS_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      <<: *backend-environment
      RUN_MIGRATIONS_ON_STARTUP: "false"
      SEED_ADMIN_ON_STARTUP: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command:
      [
        "celery",
        "-A",
        "app.tasks.celery_app.celery_app",
        "worker",
        "--loglevel=${LOG_LEVEL:-INFO}",
        "--concurrency=${NOTIFICATION_WORKER_CONCURRENCY:-4}",
        "--queues=notifications",
        "-n",
        "notifications@%h",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from app.tasks.celery_app import celery_app; import os, sys; target = f'notifications@{os.environ[\\\"HOSTNAME\\\"]}'; result = celery_app.control.inspect(timeout=2).ping([target]) or {}; sys.exit(0 if target in result else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - backplane

  beat:
    image: ghcr.io/patriksi/threatlens-backend:${THREATLENS_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      <<: *backend-environment
      RUN_MIGRATIONS_ON_STARTUP: "false"
      SEED_ADMIN_ON_STARTUP: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["python", "-m", "app.tasks.beat_watchdog"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -m app.tasks.beat_watchdog --check",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - backplane

  web:
    image: ghcr.io/patriksi/threatlens-web:${THREATLENS_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${THREATLENS_WEB_PORT:-3000}:3000"
    environment:
      THREATLENS_CSP_CONNECT_SRC: "${THREATLENS_CSP_CONNECT_SRC:-'self'}"
      THREATLENS_CSP_FRAME_SRC: "${THREATLENS_CSP_FRAME_SRC:-'self'}"
    networks:
      - frontend

volumes:
  postgres_data:
  redis_data:

networks:
  frontend: {}
  backplane: {}
