name: Quality gates

on:
  pull_request:
  push:
    branches:
      - dev
  workflow_call:

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository diff hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject whitespace errors in the aggregate change
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_sha="${PR_BASE_SHA:-${BEFORE_SHA:-}}"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
          git diff --check "${base_sha}...HEAD"

  backend:
    name: Backend tests and contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-lock.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Compile backend
        run: python -m compileall -q backend/app backend/alembic

      - name: Enforce source size and backend complexity
        run: |
          python scripts/check-source-size.py
          cd backend
          python -m ruff check app

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

      - name: Verify generated API contract
        run: |
          python backend/scripts/generate_api_reference.py
          git diff --exit-code -- docs/reference/api.md docs/reference/openapi.json

      - name: Verify runtime lockfile
        run: |
          python backend/scripts/generate_runtime_lockfile.py --output /tmp/requirements-lock.txt
          diff -u backend/requirements-lock.txt /tmp/requirements-lock.txt

      - name: Audit Python runtime dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r backend/requirements-lock.txt

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run frontend tests
        working-directory: web
        run: npm test

      - name: Lint frontend
        working-directory: web
        run: npm run lint

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Audit frontend dependencies
        working-directory: web
        run: npm run audit

  migrations:
    name: PostgreSQL migration round trip
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: threatlens
          POSTGRES_USER: threatlens
          POSTGRES_PASSWORD: threatlens-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U threatlens -d threatlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://threatlens:threatlens-ci-password@127.0.0.1:5432/threatlens
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: ci-jwt-secret-with-at-least-thirty-two-characters
      APP_DATA_ENCRYPTION_KEY: ci-data-key-with-at-least-thirty-two-characters
      REQUIRE_EXPLICIT_DATA_ENCRYPTION_KEY: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-lock.txt

      - name: Verify a single migration head
        working-directory: backend
        run: test "$(python -m alembic heads | wc -l)" -eq 1

      - name: Exercise upgrade and downgrade path
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic current | grep -F '(head)'
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic current | grep -F '(head)'

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze source
        uses: github/codeql-action/analyze@v4

  container-smoke:
    name: Container smoke and image scan
    needs:
      - backend
      - frontend
      - migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate isolated Compose environment
        env:
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: ci-admin-password-with-sufficient-length
        run: ./bootstrap.sh --force

      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet

      - name: Build and start stack
        env:
          BUILD_DATE: 1970-01-01T00:00:00Z
          VCS_REF: ${{ github.sha }}
        run: |
          APP_VERSION="$(cat VERSION)" docker compose -f docker-compose.yml -f docker-compose.build.yml build --pull
          APP_VERSION="$(cat VERSION)" docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --no-build --wait

      - name: Verify running stack
        run: |
          readiness_url="http://localhost:3000/api/v1/health"
          for attempt in {1..24}; do
            if readiness="$(curl --fail --silent --show-error "$readiness_url" 2>&1)"; then
              printf '%s\n' "$readiness"
              break
            fi
            if [[ "$attempt" -eq 24 ]]; then
              echo "Stack readiness did not converge within 120 seconds: $readiness" >&2
              docker compose ps
              exit 1
            fi
            sleep 5
          done
          test "$(curl --fail --silent http://localhost:3000/api/openapi.json | jq -r '.info.version')" = "$(cat VERSION)"
          docker compose exec -T api python -m alembic current | grep -F '(head)'
          docker compose ps

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/patriksi/threatlens-backend:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/patriksi/threatlens-web:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Show container logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans
