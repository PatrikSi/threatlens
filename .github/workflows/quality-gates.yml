name: Quality gates

on:
  pull_request:
  push:
    branches:
      - dev
  workflow_call:
    inputs:
      run_container_smoke:
        description: Build, scan, and smoke-test local Compose images.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository diff hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject whitespace errors in the aggregate change
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          generated_legal_artifacts=(
            ':(exclude)docs/reference/backend-runtime-package-legal/**'
            ':(exclude)docs/reference/backend-os-package-legal/**'
            ':(exclude)docs/reference/frontend-runtime-package-legal/**'
            ':(exclude)docs/reference/frontend-os-package-legal/**'
          )
          base_sha="${PR_BASE_SHA:-${BEFORE_SHA:-}}"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse --verify HEAD^ 2>/dev/null || true)"
          fi
          if [[ -n "$base_sha" ]]; then
            echo "Checking whitespace errors in ${base_sha}...HEAD"
            git diff --check "${base_sha}...HEAD" -- . "${generated_legal_artifacts[@]}"
          else
            empty_tree="$(git hash-object -t tree /dev/null)"
            echo "Checking whitespace errors from the empty tree to HEAD"
            git diff --check "$empty_tree" HEAD -- . "${generated_legal_artifacts[@]}"
          fi

  backend:
    name: Backend tests and contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      THREATLENS_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-lock.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: timeout 10m python -m pip install -r backend/requirements-dev.txt

      - name: Compile backend
        run: python -m compileall -q backend/app backend/alembic

      - name: Enforce source size and backend complexity
        run: |
          python scripts/check-source-size.py
          cd backend
          python -m ruff check app

      - name: Run backend tests
        working-directory: backend
        run: >-
          timeout 25m python -m pytest
          --cov=app
          --cov-branch
          --cov-report=term
          --cov-report=json:coverage.json
          --cov-fail-under=79

      - name: Run isolated concurrent capacity smoke
        timeout-minutes: 3
        run: >-
          env -u THREATLENS_TEST_DATABASE_URL -u THREATLENS_TEST_REDIS_URL
          timeout 2m python backend/scripts/run_capacity_baseline.py
          --profile smoke --output backend/capacity-smoke.json

      - name: Upload capacity smoke measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-smoke
          path: backend/capacity-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce critical backend coverage floors
        run: python scripts/check_coverage.py backend/coverage.json

      - name: Verify generated API contract
        run: |
          python backend/scripts/generate_api_reference.py
          git diff --exit-code -- docs/reference/api.md docs/reference/openapi.json

      - name: Verify browser preview fixture matches backend policy
        run: |
          python web/browser/generate_preview_fixture.py
          git diff --exit-code -- web/browser/preview-response.json

      - name: Verify runtime lockfile
        run: |
          timeout 6m python backend/scripts/generate_runtime_lockfile.py --output /tmp/requirements-lock.txt
          diff -u backend/requirements-lock.txt /tmp/requirements-lock.txt

      - name: Audit Python runtime dependencies
        run: |
          timeout 5m python -m pip install pip-audit
          timeout 5m python -m pip_audit -r backend/requirements-lock.txt

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: timeout 10m npm ci

      - name: Run frontend tests
        working-directory: web
        run: timeout 10m npm test

      - name: Lint frontend
        working-directory: web
        run: npm run lint

      - name: Build frontend
        working-directory: web
        run: timeout 10m npm run build

      - name: Smoke test production frontend
        working-directory: web
        run: timeout 1m npm run test:dist

      - name: Audit frontend dependencies
        working-directory: web
        run: timeout 5m npm run audit

  browsers:
    name: Browser workflows (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install browser and server dependencies
        run: |
          timeout 10m python -m pip install -r backend/requirements-dev.txt
          cd web
          timeout 10m npm ci
          timeout 5m npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run isolated interaction workflows
        working-directory: web
        run: timeout 5m npm run test:browser -- --project=${{ matrix.browser }}

      - name: Run real-server auth and accessibility workflows
        run: timeout 10m python web/browser/server/run.py --project=${{ matrix.browser }}

      - name: Run real-server AI provider and statistics workflows
        run: timeout 5m python web/browser/server/run.py --project=${{ matrix.browser }} --ai-providers --grep 'real AI provider settings|real statistics combines'

      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.browser }}
          path: |
            web/test-results/
            web/browser-server*.log
          retention-days: 7

  migrations:
    name: PostgreSQL migration round trip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: threatlens
          POSTGRES_USER: threatlens
          POSTGRES_PASSWORD: threatlens-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U threatlens -d threatlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://threatlens:threatlens-ci-password@127.0.0.1:5432/threatlens
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: ci-jwt-secret-with-at-least-thirty-two-characters
      APP_DATA_ENCRYPTION_KEY: ci-data-key-with-at-least-thirty-two-characters
      REQUIRE_EXPLICIT_DATA_ENCRYPTION_KEY: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt

      - name: Install backend dependencies
        run: timeout 10m python -m pip install -r backend/requirements-lock.txt

      - name: Verify a single migration head
        working-directory: backend
        run: test "$(python -m alembic heads | wc -l)" -eq 1

      - name: Exercise populated upgrade and downgrade path
        working-directory: backend
        run: |
          timeout 5m python -m alembic upgrade 0042_user_source
          python scripts/upgrade_compatibility_fixture.py seed
          timeout 5m python -m alembic upgrade 0100_ai_evidence_provenance
          python scripts/enterprise_upgrade_fixture.py seed
          timeout 5m python -m alembic upgrade head
          python scripts/upgrade_compatibility_fixture.py verify
          python scripts/enterprise_upgrade_fixture.py verify
          python scripts/enterprise_upgrade_fixture.py verify-guards
          python -m alembic current | grep -F '(head)'
          python -m alembic check
          timeout 5m python -m alembic downgrade base
          timeout 5m python -m alembic upgrade head
          python -m alembic current | grep -F '(head)'

  recovery:
    name: Recovery tooling tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ShellCheck when absent
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi

      - name: Validate recovery shell
        run: |
          for script in scripts/recovery/*.sh; do
            bash -n "$script"
          done
          shellcheck scripts/recovery/*.sh

      - name: Run non-destructive recovery tests
        run: >-
          timeout 10m python -m unittest discover
          --start-directory tests/recovery
          --pattern 'test_*.py'
          --verbose

  recovery_docker:
    name: Disposable PostgreSQL recovery drill
    needs:
      - recovery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RECOVERY_E2E_BACKEND_IMAGE: threatlens-backend:recovery-e2e
      THREATLENS_RUN_DOCKER_RECOVERY_E2E: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the recovery backend image
        run: >-
          timeout 20m docker build
          --file docker/backend.Dockerfile
          --build-arg APP_VERSION="$(cat VERSION)"
          --tag "$RECOVERY_E2E_BACKEND_IMAGE"
          backend

      - name: Exercise backup, verification, drill, restore, and reconciliation
        run: >-
          timeout 20m python -m unittest
          tests.recovery.test_recovery_docker_e2e
          --verbose

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze source
        uses: github/codeql-action/analyze@v4

  container-smoke:
    name: Container smoke and image scan (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      THREATLENS_DEV_IMAGE_TAG: dev
      THREATLENS_SMOKE_ARCH: ${{ matrix.arch }}
      THREATLENS_SMOKE_PLATFORM: linux/${{ matrix.arch }}
    # Direct push/PR runs have no input (`null`); only a reusable caller's
    # explicit false disables this job.
    # These isolated builds consume no test-job artifacts. Run them independently
    # so a test failure does not hide deployment failures in the same candidate.
    if: ${{ toJSON(inputs.run_container_smoke) != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up ARM64 emulation
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Generate isolated Compose environment
        env:
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: ci-admin-password-with-sufficient-length
        run: timeout 3m ./bootstrap.sh --force

      - name: Validate Compose configuration
        run: timeout 1m docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet

      - name: Prepare restrictive frontend build context
        run: |
          restricted_context="$(mktemp -d "${RUNNER_TEMP}/threatlens-web-smoke.XXXXXX")"
          (
            umask 077
            git archive --format=tar HEAD web docker/web.Dockerfile |
              tar --no-same-permissions -xf - -C "$restricted_context"
          )
          python3 - "$restricted_context" <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          for relative in (
              "web/nginx/nginx.conf",
              "web/nginx/default.conf.template",
              "web/public/theme-init.js",
              "web/compliance/LICENSE",
          ):
              assert root.joinpath(relative).stat().st_mode & 0o077 == 0, relative
          override = root / "build-context.json"
          service_names = subprocess.check_output([
              "docker", "compose", "-f", "docker-compose.yml", "-f",
              "docker-compose.build.yml", "config", "--services",
          ], text=True).splitlines()
          # Qualify every application process on the target architecture while
          # PostgreSQL and Redis remain native infrastructure on the runner.
          services = {
              name: {"platform": os.environ["THREATLENS_SMOKE_PLATFORM"]}
              for name in service_names if name not in {"db", "redis"}
          }
          if os.environ["THREATLENS_SMOKE_ARCH"] == "arm64":
              # Match exact-image publication's QEMU startup allowance. Native
              # smoke retains the normal deployment health-check budgets.
              for name, service in services.items():
                  if name.startswith("worker") or name == "beat":
                      service["healthcheck"] = {
                          "interval": "90s", "timeout": "180s",
                          "retries": 2, "start_period": "120s",
                      }
          services["web"]["build"] = {
              "context": str(root / "web"),
              "dockerfile": str(root / "docker/web.Dockerfile"),
          }
          override.write_text(json.dumps({"services": services}))
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"THREATLENS_WEB_SMOKE_OVERRIDE={override}\n")
          PY

      - name: Build and start stack
        env:
          BUILD_DATE: 1970-01-01T00:00:00Z
          VCS_REF: ${{ github.sha }}
        run: |
          THREATLENS_BUILD_VERSION="$(cat VERSION)" timeout 30m docker compose -f docker-compose.yml -f docker-compose.build.yml -f "$THREATLENS_WEB_SMOKE_OVERRIDE" build --pull
          start_timeout=5m
          wait_timeout=180
          if [[ "$THREATLENS_SMOKE_ARCH" == arm64 ]]; then
            start_timeout=10m
            wait_timeout=480
          fi
          THREATLENS_BUILD_VERSION="$(cat VERSION)" timeout "$start_timeout" docker compose -f docker-compose.yml -f docker-compose.build.yml -f "$THREATLENS_WEB_SMOKE_OVERRIDE" up -d --no-build --wait --wait-timeout "$wait_timeout"

      - name: Verify running stack
        run: |
          test "$(docker image inspect threatlens-backend:dev --format '{{.Architecture}}')" = "$THREATLENS_SMOKE_ARCH"
          test "$(docker image inspect threatlens-web:dev --format '{{.Architecture}}')" = "$THREATLENS_SMOKE_ARCH"
          readiness_url="http://localhost:3000/api/v1/health"
          for attempt in {1..24}; do
            if readiness="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 "$readiness_url" 2>&1)"; then
              printf '%s\n' "$readiness"
              break
            fi
            if [[ "$attempt" -eq 24 ]]; then
              echo "Stack readiness did not converge within 120 seconds: $readiness" >&2
              docker compose ps
              exit 1
            fi
            sleep 5
          done
          test "$(curl --fail --silent --show-error --connect-timeout 5 --max-time 60 http://localhost:3000/api/openapi.json | jq -r '.info.version')" = "$(cat VERSION)"
          curl --fail --silent --show-error --connect-timeout 5 --max-time 10 http://localhost:3000/theme-init.js | cmp web/public/theme-init.js -
          # Expand the user lookup inside the container's shell.
          # shellcheck disable=SC2016
          timeout 1m docker compose exec -T web sh -ec 'test "$(id -u)" != 0; test -r /usr/share/doc/threatlens/LICENSE; test -r /usr/share/doc/threatlens/licenses/MIT.txt'
          timeout 1m docker compose exec -T api python -m alembic current | grep -F '(head)'
          docker compose ps

      - name: Verify access logs omit sensitive query values
        run: >-
          timeout 1m python3 scripts/verify_access_log_privacy.py
          --base-url http://localhost:3000
          --container "$(docker compose ps -q web)"
          --container "$(docker compose ps -q api)"

      - name: Verify checked-in dependency and legal artifacts
        if: matrix.arch == 'amd64'
        run: >-
          timeout 3m python3 scripts/verify_image_dependency_artifacts.py
          --backend-image threatlens-backend:dev --web-image threatlens-web:dev

      - name: Verify bounded editorial uploads through the proxy
        run: timeout 1m python3 scripts/verify_report_upload_proxy.py --base-url http://localhost:3000

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: threatlens-backend:${{ env.THREATLENS_DEV_IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: threatlens-web:${{ env.THREATLENS_DEV_IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Show container logs after failure
        if: failure()
        run: timeout 2m docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: timeout 3m docker compose down -v --remove-orphans
