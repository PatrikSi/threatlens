name: Quality gates

on:
  pull_request:
  push:
    branches:
      - dev
  workflow_call:
    inputs:
      run_container_smoke:
        description: Build, scan, and smoke-test local Compose images.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository diff hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject whitespace errors in the aggregate change
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          generated_legal_artifacts=(
            ':(exclude)docs/reference/backend-runtime-package-legal/**'
            ':(exclude)docs/reference/backend-os-package-legal/**'
            ':(exclude)docs/reference/frontend-runtime-package-legal/**'
            ':(exclude)docs/reference/frontend-os-package-legal/**'
          )
          base_sha="${PR_BASE_SHA:-${BEFORE_SHA:-}}"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse --verify HEAD^ 2>/dev/null || true)"
          fi
          if [[ -n "$base_sha" ]]; then
            echo "Checking whitespace errors in ${base_sha}...HEAD"
            git diff --check "${base_sha}...HEAD" -- . "${generated_legal_artifacts[@]}"
          else
            empty_tree="$(git hash-object -t tree /dev/null)"
            echo "Checking whitespace errors from the empty tree to HEAD"
            git diff --check "$empty_tree" HEAD -- . "${generated_legal_artifacts[@]}"
          fi

  backend:
    name: Backend tests and contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      THREATLENS_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-lock.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: timeout 10m python -m pip install -r backend/requirements-dev.txt

      - name: Compile backend
        run: python -m compileall -q backend/app backend/alembic

      - name: Enforce source size and backend complexity
        run: |
          python scripts/check-source-size.py
          cd backend
          python -m ruff check app

      - name: Run backend tests
        working-directory: backend
        run: >-
          timeout 25m python -m pytest
          --cov=app
          --cov-branch
          --cov-report=term
          --cov-report=json:coverage.json
          --cov-fail-under=79

      - name: Enforce critical backend coverage floors
        run: python scripts/check_coverage.py backend/coverage.json

      - name: Verify generated API contract
        run: |
          python backend/scripts/generate_api_reference.py
          git diff --exit-code -- docs/reference/api.md docs/reference/openapi.json

      - name: Verify runtime lockfile
        run: |
          timeout 6m python backend/scripts/generate_runtime_lockfile.py --output /tmp/requirements-lock.txt
          diff -u backend/requirements-lock.txt /tmp/requirements-lock.txt

      - name: Audit Python runtime dependencies
        run: |
          timeout 5m python -m pip install pip-audit
          timeout 5m python -m pip_audit -r backend/requirements-lock.txt

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: timeout 10m npm ci

      - name: Run frontend tests
        working-directory: web
        run: timeout 10m npm test

      - name: Lint frontend
        working-directory: web
        run: npm run lint

      - name: Build frontend
        working-directory: web
        run: timeout 10m npm run build

      - name: Smoke test production frontend
        working-directory: web
        run: timeout 1m npm run test:dist

      - name: Audit frontend dependencies
        working-directory: web
        run: timeout 5m npm run audit

  migrations:
    name: PostgreSQL migration round trip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: threatlens
          POSTGRES_USER: threatlens
          POSTGRES_PASSWORD: threatlens-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U threatlens -d threatlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://threatlens:threatlens-ci-password@127.0.0.1:5432/threatlens
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: ci-jwt-secret-with-at-least-thirty-two-characters
      APP_DATA_ENCRYPTION_KEY: ci-data-key-with-at-least-thirty-two-characters
      REQUIRE_EXPLICIT_DATA_ENCRYPTION_KEY: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt

      - name: Install backend dependencies
        run: timeout 10m python -m pip install -r backend/requirements-lock.txt

      - name: Verify a single migration head
        working-directory: backend
        run: test "$(python -m alembic heads | wc -l)" -eq 1

      - name: Exercise populated upgrade and downgrade path
        working-directory: backend
        run: |
          timeout 5m python -m alembic upgrade 0042_user_source
          python scripts/upgrade_compatibility_fixture.py seed
          timeout 5m python -m alembic upgrade head
          python scripts/upgrade_compatibility_fixture.py verify
          python -m alembic current | grep -F '(head)'
          python -m alembic check
          timeout 5m python -m alembic downgrade base
          timeout 5m python -m alembic upgrade head
          python -m alembic current | grep -F '(head)'

  recovery:
    name: Recovery tooling tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ShellCheck when absent
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi

      - name: Validate recovery shell
        run: |
          for script in scripts/recovery/*.sh; do
            bash -n "$script"
          done
          shellcheck scripts/recovery/*.sh

      - name: Run non-destructive recovery tests
        run: >-
          timeout 10m python -m unittest discover
          --start-directory tests/recovery
          --pattern 'test_*.py'
          --verbose

  recovery_docker:
    name: Disposable PostgreSQL recovery drill
    needs:
      - recovery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RECOVERY_E2E_BACKEND_IMAGE: threatlens-backend:recovery-e2e
      THREATLENS_RUN_DOCKER_RECOVERY_E2E: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the recovery backend image
        run: >-
          timeout 20m docker build
          --build-arg APP_VERSION="$(cat VERSION)"
          --tag "$RECOVERY_E2E_BACKEND_IMAGE"
          backend

      - name: Exercise backup, verification, drill, restore, and reconciliation
        run: >-
          timeout 20m python -m unittest
          tests.recovery.test_recovery_docker_e2e
          --verbose

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze source
        uses: github/codeql-action/analyze@v4

  container-smoke:
    name: Container smoke and image scan
    # Direct push/PR runs have no input (`null`); only a reusable caller's
    # explicit false disables this job.
    if: >-
      ${{
        toJSON(inputs.run_container_smoke) != 'false' &&
        needs.backend.result == 'success' &&
        needs.frontend.result == 'success' &&
        needs.migrations.result == 'success'
      }}
    needs:
      - backend
      - frontend
      - migrations
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate isolated Compose environment
        env:
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: ci-admin-password-with-sufficient-length
        run: timeout 3m ./bootstrap.sh --force

      - name: Validate Compose configuration
        run: timeout 1m docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet

      - name: Build and start stack
        env:
          BUILD_DATE: 1970-01-01T00:00:00Z
          VCS_REF: ${{ github.sha }}
        run: |
          THREATLENS_BUILD_VERSION="$(cat VERSION)" timeout 30m docker compose -f docker-compose.yml -f docker-compose.build.yml build --pull
          THREATLENS_BUILD_VERSION="$(cat VERSION)" timeout 5m docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --no-build --wait --wait-timeout 180

      - name: Verify running stack
        run: |
          readiness_url="http://localhost:3000/api/v1/health"
          for attempt in {1..24}; do
            if readiness="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 "$readiness_url" 2>&1)"; then
              printf '%s\n' "$readiness"
              break
            fi
            if [[ "$attempt" -eq 24 ]]; then
              echo "Stack readiness did not converge within 120 seconds: $readiness" >&2
              docker compose ps
              exit 1
            fi
            sleep 5
          done
          test "$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 http://localhost:3000/api/openapi.json | jq -r '.info.version')" = "$(cat VERSION)"
          timeout 1m docker compose exec -T api python -m alembic current | grep -F '(head)'
          docker compose ps

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/patriksi/threatlens-backend:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/patriksi/threatlens-web:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Show container logs after failure
        if: failure()
        run: timeout 2m docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: timeout 3m docker compose down -v --remove-orphans
