name: Capacity release comparison

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Committed baseline ref containing the version 2 capacity harness
        required: true
        type: string
      candidate_ref:
        description: Committed candidate ref containing the same measurement contract
        required: true
        type: string
        default: dev
      runner:
        description: Use a dedicated disposable runner for intended-hardware qualification
        type: choice
        options:
          - ubuntu-latest
          - threatlens-capacity
        default: ubuntu-latest
      target_id:
        description: Stable hardware/profile identifier (no secrets)
        type: string
        required: true
        default: github-hosted-reference
      profile:
        description: Run the same bounded workload for both refs on this runner
        type: choice
        options:
          - baseline
          - sustained
        default: sustained
      diagnostics:
        description: Collect bounded transaction and host timing for sustained runs
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compare:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare isolated release worktrees and interpreters
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          CAPACITY_PROFILE: ${{ inputs.profile }}
          CAPACITY_DIAGNOSTICS: ${{ inputs.diagnostics }}
        run: |
          if [[ "$CAPACITY_DIAGNOSTICS" == true && "$CAPACITY_PROFILE" != sustained ]]; then
            echo "Capacity diagnostics require the sustained profile" >&2
            exit 2
          fi
          baseline_sha="$(git rev-parse --verify --end-of-options "${BASELINE_REF}^{commit}")"
          candidate_sha="$(git rev-parse --verify --end-of-options "${CANDIDATE_REF}^{commit}")"
          git worktree add --detach /tmp/threatlens-capacity-baseline "$baseline_sha"
          git worktree add --detach /tmp/threatlens-capacity-candidate "$candidate_sha"
          for release in baseline candidate; do
            release_dir="/tmp/threatlens-capacity-${release}"
            python -m venv "/tmp/threatlens-capacity-python-${release}"
            timeout 10m "/tmp/threatlens-capacity-python-${release}/bin/python" -m pip install -r "${release_dir}/backend/requirements-dev.txt"
          done
          mkdir -p capacity-results

      - name: Measure both releases sequentially on this runner
        env:
          CAPACITY_PROFILE: ${{ inputs.profile }}
          CAPACITY_TARGET: ${{ inputs.target_id }}
          CAPACITY_DIAGNOSTICS: ${{ inputs.diagnostics }}
        run: |
          capacity_docker_host="$(timeout 20s python scripts/operations/run_capacity_reference.py --print-docker-host)"
          export DOCKER_HOST="$capacity_docker_host"
          unset DOCKER_CONTEXT
          profile_args=(--profile "$CAPACITY_PROFILE")
          if [[ "$CAPACITY_PROFILE" == sustained ]]; then
            profile_args+=(--duration-seconds 600)
          fi
          if [[ "${CAPACITY_DIAGNOSTICS:-false}" == true ]]; then
            timeout 20s python scripts/operations/run_capacity_diagnostic.py \
              --describe-observer --observer-dir "$GITHUB_WORKSPACE/scripts/operations" \
              --output "$GITHUB_WORKSPACE/capacity-results/diagnostic-observer-identity.json"
          fi
          for release in baseline candidate; do
            capacity_command=("/tmp/threatlens-capacity-python-${release}/bin/python" \
              "/tmp/threatlens-capacity-${release}/backend/scripts/run_capacity_baseline.py")
            if [[ "${CAPACITY_DIAGNOSTICS:-false}" == true ]]; then
              capacity_command=("/tmp/threatlens-capacity-python-${release}/bin/python" \
                "$GITHUB_WORKSPACE/scripts/operations/run_capacity_diagnostic.py" \
                --entrypoint "/tmp/threatlens-capacity-${release}/backend/scripts/run_capacity_baseline.py" \
                --observer-dir "$GITHUB_WORKSPACE/scripts/operations" \
                --output "$GITHUB_WORKSPACE/capacity-results/${release}-diagnostics.json" --)
            fi
            python scripts/operations/run_capacity_reference.py \
              --artifact "$GITHUB_WORKSPACE/capacity-results/${release}.json" \
              --log "$GITHUB_WORKSPACE/capacity-results/${release}.log" \
              --attestation "$GITHUB_WORKSPACE/capacity-results/${release}-cleanup-attestation.json" -- \
              timeout 15m "${capacity_command[@]}" \
              "${profile_args[@]}" --target-id "$CAPACITY_TARGET" --cpu-count 1 --max-rss-mib 1024 \
              --output "$GITHUB_WORKSPACE/capacity-results/${release}.json"
            if [[ "${CAPACITY_DIAGNOSTICS:-false}" == true ]]; then
              timeout 20s python scripts/operations/run_capacity_diagnostic.py \
                --verify --observer-dir "$GITHUB_WORKSPACE/scripts/operations" \
                --identity "$GITHUB_WORKSPACE/capacity-results/diagnostic-observer-identity.json" \
                --measurement "$GITHUB_WORKSPACE/capacity-results/${release}.json" \
                --output "$GITHUB_WORKSPACE/capacity-results/${release}-diagnostics.json" \
                --source-revision "$(git -C "/tmp/threatlens-capacity-${release}" rev-parse HEAD)"
            fi
          done

      - name: Compare compatible measurement artifacts
        run: |
          /tmp/threatlens-capacity-python-candidate/bin/python \
            /tmp/threatlens-capacity-candidate/backend/scripts/compare_capacity_runs.py \
            capacity-results/baseline.json capacity-results/candidate.json \
            --output capacity-results/comparison.json

      - name: Preserve measurements and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-release-comparison
          path: capacity-results/
          if-no-files-found: warn
          retention-days: 90
