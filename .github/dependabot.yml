version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-runtime:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # Firefox ARIA reflection crashes; later fixed versions remain eligible.
      # https://github.com/microsoft/playwright/issues/43967
      - dependency-name: "@playwright/test"
        versions: ["1.65.0", "1.65.1"]
    groups:
      frontend:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /
      - /docker
    schedule:
      interval: weekly
