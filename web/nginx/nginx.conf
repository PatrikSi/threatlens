# Fixed worker count respects the web service's CPU/PID allocation even when
# the host exposes many CPUs. All writable paths are on bounded tmpfs mounts.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    include /etc/nginx/conf.d/*.conf;
}
