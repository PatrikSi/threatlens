# Fixed worker count respects the web service's CPU/PID allocation even when
# the host exposes many CPUs. All writable paths are on bounded tmpfs mounts.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # nginx request-error messages include the original request line and cannot
    # use a redacting log_format. Preserve master/startup stderr above; request
    # failures use the structured access record below, including upstream status.
    error_log /dev/null;
    map $upstream_http_x_request_id $threatlens_request_id {
        "" $request_id;
        default $upstream_http_x_request_id;
    }
    proxy_hide_header X-Request-ID;
    proxy_connect_timeout 5s;
    # Query strings and Referer can carry OIDC codes or analyst search terms.
    # Log the normalized path and request reference without those values.
    log_format threatlens escape=json
        '{"timestamp":"$time_iso8601","method":"$request_method",'
        '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"duration_seconds":$request_time,"upstream_status":"$upstream_status",'
        '"upstream_duration_seconds":"$upstream_response_time",'
        '"request_id":"$threatlens_request_id"}';
    access_log /dev/stdout threatlens;
    sendfile on;
    keepalive_timeout 65;
    include /etc/nginx/conf.d/*.conf;
}
