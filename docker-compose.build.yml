services:
  api:
    pull_policy: build
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-1.6.0}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        VCS_REF: ${VCS_REF:-unknown}

  worker:
    pull_policy: never

  worker-ai:
    pull_policy: never

  worker-maintenance:
    pull_policy: never

  worker-notifications:
    pull_policy: never

  beat:
    pull_policy: never

  web:
    pull_policy: build
    build:
      context: ./web
      args:
        APP_VERSION: ${APP_VERSION:-1.6.0}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        VCS_REF: ${VCS_REF:-unknown}
        VITE_API_BASE_URL: ${WEB_VITE_API_BASE_URL:-/api/v1}
